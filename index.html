<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1769e0">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>MY ASSET</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#eef2f7;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;
  color:#172033;
}

.app{
  max-width:460px;
  min-height:100vh;
  margin:auto;
  background:#f8fafc;
  padding-bottom:80px;
}

.header{
  position:sticky;
  top:0;
  z-index:10;
  background:#fff;
  padding:18px 18px 15px;
  border-bottom:1px solid #e9edf2;
}

.logo{
  font-size:21px;
  font-weight:900;
}

.logo span{
  color:#1769e0;
}

.wrap{
  padding:16px;
}

.hidden{
  display:none!important;
}

.card{
  background:#fff;
  border:1px solid #e5eaf0;
  border-radius:18px;
  padding:16px;
  margin:10px 0;
  box-shadow:0 3px 12px rgba(20,40,70,.05);
}

.hero{
  background:linear-gradient(135deg,#1769e0,#4389ed);
  color:#fff;
  border-radius:22px;
  padding:22px;
  box-shadow:0 8px 25px rgba(23,105,224,.22);
}

.hero .small{
  opacity:.85;
  font-size:12px;
}

.hero .total{
  font-size:30px;
  font-weight:900;
  margin:7px 0;
}

.hero .change{
  font-size:13px;
}

.section{
  font-size:16px;
  font-weight:900;
  margin:23px 2px 10px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.muted{
  color:#78869a;
  font-size:12px;
}

.big{
  font-size:20px;
  font-weight:900;
}

.money{
  font-weight:900;
  font-size:16px;
}

.positive{
  color:#1769e0;
}

.negative{
  color:#e5484d;
}

.account{
  cursor:pointer;
}

.account-name{
  font-weight:900;
  font-size:15px;
}

.account-value{
  font-size:18px;
  font-weight:900;
  margin-top:5px;
}

.account-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.mini{
  background:#fff;
  border:1px solid #e5eaf0;
  border-radius:16px;
  padding:14px;
}

.bar{
  height:8px;
  background:#edf1f5;
  border-radius:20px;
  overflow:hidden;
  margin-top:9px;
}

.bar i{
  display:block;
  height:100%;
  background:#1769e0;
  border-radius:20px;
}

.chart{
  display:flex;
  align-items:flex-end;
  gap:8px;
  height:170px;
  padding:10px 4px 0;
}

.chart-col{
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
}

.chart-bar{
  width:70%;
  min-height:4px;
  border-radius:7px 7px 3px 3px;
  background:#1769e0;
}

.chart-label{
  font-size:10px;
  color:#8290a2;
  margin-top:6px;
}

.chart-value{
  font-size:9px;
  color:#526176;
  margin-bottom:4px;
}

.nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(460px,100%);
  height:70px;
  background:#fff;
  border-top:1px solid #e4e9ef;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.nav button{
  border:0;
  background:none;
  color:#7d8999;
  font-size:10px;
  cursor:pointer;
}

.nav button b{
  display:block;
  font-size:20px;
  margin-bottom:3px;
}

.nav button.on{
  color:#1769e0;
}

.btn{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px;
  background:#1769e0;
  color:#fff;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
  margin-top:8px;
}

.btn.gray{
  background:#edf2f7;
  color:#334155;
}

input{
  width:100%;
  border:1px solid #dce3eb;
  border-radius:12px;
  padding:13px;
  font-size:15px;
  background:#fff;
}

label{
  display:block;
  font-size:12px;
  font-weight:800;
  margin:13px 0 6px;
}

.back{
  border:0;
  background:none;
  font-size:25px;
  padding:0;
  cursor:pointer;
}

.title{
  font-size:23px;
  font-weight:900;
}

.month{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.month button{
  border:0;
  background:#edf3fa;
  border-radius:10px;
  padding:8px 12px;
  cursor:pointer;
}

.table-row{
  display:grid;
  grid-template-columns:1.25fr 1fr 1fr;
  gap:5px;
  align-items:center;
  padding:11px 0;
  border-bottom:1px solid #edf0f3;
  font-size:12px;
}

.table-row:last-child{
  border-bottom:0;
}

.holding{
  padding:13px 0;
  border-bottom:1px solid #edf0f3;
}

.holding:last-child{
  border-bottom:0;
}

.notice{
  background:#edf6ff;
  border:1px solid #d6eaff;
  color:#315477;
  border-radius:15px;
  padding:13px;
  font-size:12px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="logo"><span>₩</span> MY ASSET</div>
</header>


<!-- HOME -->
<section id="home" class="wrap">

  <div class="hero">
    <div class="small" id="homeMonth">2026년 8월 기준</div>
    <div class="total" id="totalAsset">0원</div>
    <div class="change" id="totalChange">전월 대비 계산 중</div>
  </div>

  <div class="section">내 자산</div>

  <div class="account-grid" id="accountGrid"></div>

  <div class="section">총자산 추이</div>

  <div class="card">
    <div class="chart" id="chart"></div>
  </div>

  <div class="section">자산 구성</div>

  <div class="card" id="allocation"></div>

  <div class="section">최근 기록</div>

  <div class="card" id="recent"></div>

</section>


<!-- ASSETS -->
<section id="assets" class="wrap hidden">

  <button class="back" onclick="go('home')">‹</button>
  <div class="title">자산현황</div>

  <div class="card">
    <div class="muted">현재 총자산</div>
    <div class="big" id="assetTotal"></div>
  </div>

  <div id="assetCards"></div>

</section>


<!-- ACCOUNT DETAIL -->
<section id="detail" class="wrap hidden">

  <button class="back" onclick="go('assets')">‹</button>

  <div class="title" id="detailName"></div>

  <div class="card">
    <div class="muted">평가금액</div>
    <div class="big" id="detailValue"></div>

    <div style="height:12px"></div>

    <div class="row">
      <span class="muted">투자금액</span>
      <b id="detailInvest"></b>
    </div>

    <div class="row" style="margin-top:7px">
      <span class="muted">평가손익</span>
      <b id="detailProfit"></b>
    </div>

    <div class="row" style="margin-top:7px">
      <span class="muted">수익률</span>
      <b id="detailRate"></b>
    </div>
  </div>

  <div class="section">보유 종목</div>

  <div class="card" id="holdings"></div>

</section>


<!-- INVEST -->
<section id="invest" class="wrap hidden">

  <div class="title">투자현황</div>

  <div class="card">
    <div class="muted">전체 투자금액</div>
    <div class="big" id="investTotal"></div>

    <div style="height:13px"></div>

    <div class="muted">전체 평가금액</div>
    <div class="big" id="investValue"></div>

    <div style="height:13px"></div>

    <div class="muted">전체 평가손익</div>
    <div class="big" id="investProfit"></div>
  </div>

  <div class="section">계좌별 수익률</div>
  <div id="investAccounts"></div>

  <div class="section">투자자산 비중</div>
  <div class="card" id="investAllocation"></div>

</section>


<!-- MONTHLY -->
<section id="monthly" class="wrap hidden">

  <div class="title">월간기록</div>

  <div class="notice" style="margin-top:12px">
    매월 한 번 현재 자산을 입력하면 총자산과 전월 대비 변화가 자동으로 계산됩니다.
  </div>

  <div class="section">2026년 9월 업데이트</div>

  <div id="monthlyForm"></div>

  <button class="btn" onclick="saveMonth()">저장하기</button>

  <div id="saveMsg"></div>

  <div class="section">월별 기록</div>

  <div class="card" id="monthlyHistory"></div>

</section>


<!-- NAV -->
<nav class="nav">

  <button id="navHome" class="on" onclick="go('home')">
    <b>⌂</b>홈
  </button>

  <button id="navAssets" onclick="go('assets')">
    <b>▣</b>자산현황
  </button>

  <button id="navInvest" onclick="go('invest')">
    <b>↗</b>투자현황
  </button>

  <button id="navMonthly" onclick="go('monthly')">
    <b>▤</b>월간기록
  </button>

</nav>

</div>


<script>

/* =========================

    savings:{invest:11900000,value:11900000}
  }

/* =========================
   현재 보유 종목
========================= */

const holdings = {

  pension:[
    ["TIGER 미국나스닥100",30,144918,179490,5384700,0.23856],
    ["RISE 미국S&P500",205,18414,22980,4710900,0.24796],
    ["ACE KRX금현물",35,29984,28390,993650,-0.05316],
    ["ACE 미국빅테크TOP7",90,22176,24165,2174850,0.08969],
    ["TIGER 미국필라델피아반도체",28,48408,41925,1173900,-0.13392],
    ["현금",null,null,null,660891,null]
  ],

  isa:[
    ["KoAct 글로벌AI메모리반도체",120,18733,13935,1672200,-0.25613],
    ["KODEX 미국AI전력핵심인프라",60,28223,19380,1162800,-0.31333],
    ["SOL AI반도체TOP2플러스",80,24925,17250,1380000,-0.30792],
    ["TIGER 코리아AI전력기기TOP3",60,20565,19910,1194600,-0.03185],
    ["TIME 글로벌휴머노이드로봇산업",100,9200,7420,742000,-0.19348],
    ["KODEX 미국나스닥100",88,27745,26835,2361480,-0.03280],
    ["삼성전자",33,293121,256500,8464500,-0.12493],
    ["하이닉스",3,2560000,1658000,4974000,-0.35234],
    ["삼성전기",1,1790000,1405000,1405000,-0.21508],
    ["예수금",null,null,null,1057236,null]
  ],

  toss:[
    ["QQQM",20,397118,407188,8143760,0.02536],
    ["SPYM",16,123969,125013,2000208,0.00842],
    ["알파벳",10,503492,478398,4783980,-0.04984],
    ["엔비디아",12,290687,300284,3603408,0.03301],
    ["ASML",1,2873556,2341209,2341209,-0.18526],
    ["메타",2,820700,797841,1595682,-0.02785],
    ["스페이스X",1,160770,195312,195312,0.21485],
    ["QLD",32,128010,124461,3982752,-0.02772],
    ["CONL",157,13290,7798,1224286,-0.41324],
    ["ETHU",48,39269,35501,1704048,-0.09595],
    ["원화",null,null,null,0,null]
  ]

};


/* =========================
   설정
========================= */

const accounts = {
  pension:{name:"연금저축"},
  isa:{name:"ISA"},
  toss:{name:"토스증권"},
  savings:{name:"청년도약계좌"}
};

let data = JSON.parse(localStorage.getItem("myAssetData") || "null") || baseData;


/* =========================
   공통 함수
========================= */

function money(n){
  return Math.round(n).toLocaleString("ko-KR")+"원";
}

function pct(n){
  if(n === null || n === undefined || isNaN(n)) return "-";
  return (n*100).toFixed(2)+"%";
}

function profit(item){
  return item.value-item.invest;
}

function total(month){
  if(!month) return 0;
  return Object.values(accounts)
    .reduce((sum,key)=>sum+(month[key]?.value||0),0);
}

function investTotal(month){
  if(!month) return 0;
  return Object.values(accounts)
    .reduce((sum,key)=>sum+(month[key]?.invest||0),0);
}

function latestKey(){
  const keys=Object.keys(data).sort();
  return keys[keys.length-1];
}

function previousKey(key){
  const keys=Object.keys(data).sort();
  const i=keys.indexOf(key);
  return i>0?keys[i-1]:null;
}


/* =========================
   화면 이동
========================= */

function go(id){

  document.querySelectorAll("section.wrap")
    .forEach(x=>x.classList.add("hidden"));

  document.getElementById(id).classList.remove("hidden");

  document.querySelectorAll(".nav button")
    .forEach(x=>x.classList.remove("on"));

  if(id==="home") navHome.classList.add("on");
  if(id==="assets") navAssets.classList.add("on");
  if(id==="invest") navInvest.classList.add("on");
  if(id==="monthly") navMonthly.classList.add("on");

  window.scrollTo(0,0);

  if(id==="home") renderHome();
  if(id==="assets") renderAssets();
  if(id==="invest") renderInvest();
  if(id==="monthly") renderMonthly();
}


/* =========================
   홈
========================= */

function renderHome(){

  const key=latestKey();
  const month=data[key];
  const prev=data[previousKey(key)];

  const t=total(month);
  const p=prev?total(prev):0;
  const diff=t-p;

  homeMonth.textContent=month.label+" 기준";
  totalAsset.textContent=money(t);

  totalChange.textContent=
    "전월 대비 "+
    (diff>=0?"+":"")+
    money(diff)+
    " ("+
    (p?(diff/p*100).toFixed(2):0)+
    "%)";

  totalChange.className=
    "change "+(diff>=0?"":"negative");

  accountGrid.innerHTML=
    Object.entries(accounts).map(([key,a])=>{

      const v=month[key]?.value||0;

      return `
      <div class="mini account" onclick="openAccount('${key}')">
        <div class="account-name">${a.name}</div>
        <div class="account-value">${money(v)}</div>
        <div class="muted">
          ${t?((v/t)*100).toFixed(1):0}%
        </div>
      </div>`;

    }).join("");

  renderChart();
  renderAllocation();

  recent.innerHTML=`
    <div class="row">
      <span class="muted">마지막 업데이트</span>
      <b>${month.label}</b>
    </div>
    <div class="row" style="margin-top:10px">
      <span class="muted">총 투자금액</span>
      <b>${money(investTotal(month))}</b>
    </div>
    <div class="row" style="margin-top:10px">
      <span class="muted">전체 평가손익</span>
      <b class="${t-investTotal(month)>=0?'positive':'negative'}">
        ${money(t-investTotal(month))}
      </b>
    </div>
  `;
}


/* =========================
   차트
========================= */

function renderChart(){

  const keys=Object.keys(data).sort();

  const values=keys.map(k=>total(data[k]));
  const max=Math.max(...values);

  chart.innerHTML=keys.map((k,i)=>{

    const v=values[i];
    const height=max?(v/max*100):0;

    return `
      <div class="chart-col">
        <div class="chart-value">${Math.round(v/1000000)}M</div>
        <div class="chart-bar" style="height:${height}%"></div>
        <div class="chart-label">${k.slice(5)}월</div>
      </div>
    `;

  }).join("");
}


/* =========================
   자산 구성
========================= */

function renderAllocation(){

  const key=latestKey();
  const m=data[key];
  const t=total(m);

  allocation.innerHTML=
    Object.entries(accounts).map(([key,a])=>{

      const v=m[key]?.value||0;
      const ratio=t?v/t*100:0;

      return `
      <div style="margin-bottom:14px">
        <div class="row">
          <span>${a.name}</span>
          <b>${money(v)}</b>
        </div>
        <div class="bar">
          <i style="width:${ratio}%"></i>
        </div>
        <div class="muted" style="margin-top:4px">
          ${ratio.toFixed(1)}%
        </div>
      </div>
      `;

    }).join("");
}


/* =========================
   자산현황
========================= */

function renderAssets(){

  const key=latestKey();
  const m=data[key];

  assetTotal.textContent=money(total(m));

  assetCards.innerHTML=
    Object.entries(accounts).map(([key,a])=>{

      const item=m[key];
      const pf=profit(item);
      const rate=item.invest?pf/item.invest:0;

      return `
      <div class="card account" onclick="openAccount('${key}')">

        <div class="row">
          <b>${a.name}</b>
          <span class="muted">›</span>
        </div>

        <div class="account-value">
          ${money(item.value)}
        </div>

        <div class="row" style="margin-top:9px">
          <span class="muted">투자금액</span>
          <span>${money(item.invest)}</span>
        </div>

        <div class="row" style="margin-top:6px">
          <span class="muted">평가손익</span>
          <b class="${pf>=0?'positive':'negative'}">
            ${pf>=0?"+":""}${money(pf)}
          </b>
        </div>

        <div class="row" style="margin-top:6px">
          <span class="muted">수익률</span>
          <b class="${rate>=0?'positive':'negative'}">
            ${pct(rate)}
          </b>
        </div>

      </div>
      `;

    }).join("");
}


/* =========================
   계좌 상세
========================= */

function openAccount(key){

  const month=data[latestKey()];
  const item=month[key];

  detailName.textContent=accounts[key].name;
  detailValue.textContent=money(item.value);
  detailInvest.textContent=money(item.invest);

  const pf=profit(item);
  const rate=item.invest?pf/item.invest:0;

  detailProfit.textContent=(pf>=0?"+":"")+money(pf);
  detailProfit.className=pf>=0?"positive":"negative";

  detailRate.textContent=pct(rate);
  detailRate.className=rate>=0?"positive":"negative";

  if(key==="savings"){

    holdings.innerHTML=`
      <div class="holding">
        <b>청년도약계좌</b>
        <div class="muted">현재 납입금액 기준으로 관리</div>
      </div>
    `;

  }else{

    holdings.innerHTML=holdingsData(key);

  }

  go("detail");
}


function holdingsData(key){

  const arr=holdings[key]||[];

  return arr.map(x=>{

    const name=x[0];
    const qty=x[1];
    const avg=x[2];
    const cur=x[3];
    const value=x[4];
    const rate=x[5];

    return `
      <div class="holding">

        <div class="row">
          <b>${name}</b>
          <b>${money(value)}</b>
        </div>

        <div class="muted" style="margin-top:6px">

          ${qty!==null?`보유 ${qty}주 · `:""}

          ${rate!==null?
            `<span class="${rate>=0?'positive':'negative'}">
              ${pct(rate)}
            </span>`:""}

        </div>

        ${
          avg!==null?
          `<div class="muted">
            매수 ${money(avg)} · 현재 ${money(cur)}
          </div>`:""
        }

      </div>
    `;

  }).join("");
}


/* =========================
   투자현황
========================= */

function renderInvest(){

  const m=data[latestKey()];

  const it=investTotal(m);
  const tv=total(m);
  const pf=tv-it;

  investTotalEl.textContent=money(it);
  investValue.textContent=money(tv);

  investProfit.textContent=
    (pf>=0?"+":"")+money(pf);

  investProfit.className=
    "big "+(pf>=0?"positive":"negative");

  investAccounts.innerHTML=
    Object.entries(accounts).map(([key,a])=>{

      const x=m[key];
      const p=x.value-x.invest;
      const r=x.invest?p/x.invest:0;

      return `
      <div class="card">
        <div class="row">
          <b>${a.name}</b>
          <b class="${r>=0?'positive':'negative'}">
            ${pct(r)}
          </b>
        </div>

        <div class="muted" style="margin-top:8px">
          ${money(x.value)}
        </div>

        <div class="muted">
          손익
          <span class="${p>=0?'positive':'negative'}">
            ${p>=0?"+":""}${money(p)}
          </span>
        </div>
      </div>
      `;

    }).join("");

  investAllocation.innerHTML=
    Object.entries(accounts).map(([key,a])=>{

      const v=m[key].value;
      const ratio=tv?v/tv*100:0;

      return `
      <div style="margin-bottom:14px">
        <div class="row">
          <span>${a.name}</span>
          <b>${ratio.toFixed(1)}%</b>
        </div>

        <div class="bar">
          <i style="width:${ratio}%"></i>
        </div>
      </div>
      `;

    }).join("");
}

function renderHistory(){

  const keys=Object.keys(data).sort().reverse();

  monthlyHistory.innerHTML=
    keys.map(k=>{

      const m=data[k];

      return `
      <div class="table-row">

        <b>${m.label.replace("2026년 ","")}</b>

        <span>${money(total(m))}</span>

        <span class="${
          total(m)-total(data[previousKey(k)]||{})
          >=0?"positive":"negative"
        }">

          ${
            previousKey(k)
            ?
            ((total(m)-total(data[previousKey(k)]))>=0?"+":"")
            +money(total(m)-total(data[previousKey(k)]))
            :"-"
          }

        </span>

      </div>
      `;

    }).join("");
}
