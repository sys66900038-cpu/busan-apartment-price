<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1769e0">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>MY ASSET</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#eef2f7;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;
  color:#172033;
}

.app{
  max-width:460px;
  min-height:100vh;
  margin:auto;
  background:#f8fafc;
  padding-bottom:82px;
}

.header{
  background:#fff;
  padding:20px 18px 16px;
  border-bottom:1px solid #e7ebf0;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:22px;
  font-weight:900;
}

.logo span{
  color:#1769e0;
}

.wrap{
  padding:16px;
}

.card{
  background:#fff;
  border:1px solid #e5eaf0;
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 3px 12px rgba(20,40,70,.04);
}

.total-card{
  background:linear-gradient(135deg,#1769e0,#4a8df0);
  color:#fff;
  border:0;
}

.label{
  font-size:12px;
  opacity:.8;
}

.total{
  font-size:31px;
  font-weight:900;
  margin:7px 0 15px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.box{
  background:#fff;
  border:1px solid #e5eaf0;
  border-radius:16px;
  padding:15px;
}

.box .title{
  font-size:12px;
  color:#7b8797;
}

.box .value{
  font-size:19px;
  font-weight:900;
  margin-top:7px;
}

.section{
  font-size:16px;
  font-weight:900;
  margin:22px 2px 10px;
}

.muted{
  color:#7b8797;
  font-size:12px;
}

.green{color:#159447}
.red{color:#d93434}

.btn{
  width:100%;
  border:0;
  border-radius:13px;
  padding:14px;
  background:#1769e0;
  color:#fff;
  font-size:15px;
  font-weight:800;
  margin-top:8px;
}

.btn.gray{
  background:#edf1f6;
  color:#344054;
}

input,select{
  width:100%;
  padding:13px;
  border:1px solid #dce3eb;
  border-radius:12px;
  font-size:14px;
  background:#fff;
  margin-top:6px;
}

label{
  display:block;
  font-size:12px;
  font-weight:800;
  margin-top:13px;
}

.empty{
  text-align:center;
  padding:28px 10px;
  color:#8792a3;
  font-size:13px;
}

.item{
  padding:13px 0;
  border-bottom:1px solid #edf0f4;
}

.item:last-child{
  border-bottom:0;
}

.nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(460px,100%);
  height:72px;
  background:#fff;
  border-top:1px solid #e3e8ee;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.nav button{
  border:0;
  background:none;
  color:#8a95a5;
  font-size:10px;
}

.nav button b{
  display:block;
  font-size:20px;
  margin-bottom:3px;
}

.nav button.on{
  color:#1769e0;
}

.hidden{
  display:none;
}

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:30;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.modal{
  width:min(460px,100%);
  background:#fff;
  border-radius:22px 22px 0 0;
  padding:20px;
  max-height:90vh;
  overflow:auto;
}

.modal h2{
  margin:0 0 10px;
  font-size:19px;
}

.close{
  float:right;
  border:0;
  background:#edf1f6;
  border-radius:50%;
  width:32px;
  height:32px;
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="logo"><span>MY</span> ASSET</div>
  <div class="muted">우리집 자산관리</div>
</header>


<!-- HOME -->

<section id="home" class="wrap">

  <div class="card total-card">

    <div class="label">현재 순자산</div>

    <div class="total" id="netAsset">0원</div>

    <div class="row">
      <div>
        <div class="label">총자산</div>
        <b id="totalAsset">0원</b>
      </div>

      <div>
        <div class="label">총부채</div>
        <b id="totalDebt">0원</b>
      </div>
    </div>

  </div>


  <div class="section">자산 현황</div>

  <div class="grid">

    <div class="box">
      <div class="title">현금·예금</div>
      <div class="value" id="cashAsset">0원</div>
    </div>

    <div class="box">
      <div class="title">투자</div>
      <div class="value" id="investmentAsset">0원</div>
    </div>

    <div class="box">
      <div class="title">부동산</div>
      <div class="value" id="realEstateAsset">0원</div>
    </div>

    <div class="box">
      <div class="title">기타자산</div>
      <div class="value" id="etcAsset">0원</div>
    </div>

  </div>


  <div class="section">이번 달 현금흐름</div>

  <div class="grid">

    <div class="box">
      <div class="title">수입</div>
      <div class="value green" id="monthIncome">0원</div>
    </div>

    <div class="box">
      <div class="title">지출</div>
      <div class="value red" id="monthExpense">0원</div>
    </div>

  </div>


  <div class="section">최근 기록</div>

  <div class="card" id="recentList">
    <div class="empty">아직 입력된 내역이 없습니다.</div>
  </div>

</section>


<!-- LEDGER -->

<section id="ledger" class="wrap hidden">

  <div class="section" style="margin-top:4px">
    가계부
  </div>

  <div class="card">

    <div class="row">
      <div>
        <b>이번 달 수입</b>
        <div class="green" id="ledgerIncome">0원</div>
      </div>

      <div>
        <b>이번 달 지출</b>
        <div class="red" id="ledgerExpense">0원</div>
      </div>
    </div>

  </div>

  <button class="btn" onclick="openTransaction('income')">
    + 수입 입력
  </button>

  <button class="btn gray" onclick="openTransaction('expense')">
    + 지출 입력
  </button>

  <div class="section">거래내역</div>

  <div class="card" id="transactionList"></div>

</section>


<!-- ASSET -->

<section id="asset" class="wrap hidden">

  <div class="section" style="margin-top:4px">
    자산
  </div>

  <button class="btn" onclick="openAsset()">
    + 자산 추가
  </button>

  <div class="section">내 자산</div>

  <div class="card" id="assetList"></div>

</section>


<!-- DEBT -->

<section id="debt" class="wrap hidden">

  <div class="section" style="margin-top:4px">
    부채
  </div>

  <button class="btn" onclick="openDebt()">
    + 부채 추가
  </button>

  <div class="section">내 부채</div>

  <div class="card" id="debtList"></div>

</section>


<!-- ANALYSIS -->

<section id="analysis" class="wrap hidden">

  <div class="section" style="margin-top:4px">
    자산 분석
  </div>

  <div class="card">

    <div class="row">
      <span>순자산</span>
      <b id="analysisNet">0원</b>
    </div>

    <div style="height:14px"></div>

    <div class="row">
      <span>자산</span>
      <b id="analysisAsset">0원</b>
    </div>

    <div style="height:14px"></div>

    <div class="row">
      <span>부채</span>
      <b id="analysisDebt">0원</b>
    </div>

  </div>

  <div class="section">이번 달 저축</div>

  <div class="card">

    <div class="row">
      <span>수입</span>
      <b id="analysisIncome">0원</b>
    </div>

    <div class="row" style="margin-top:14px">
      <span>지출</span>
      <b id="analysisExpense">0원</b>
    </div>

    <div class="row" style="margin-top:14px">
      <span>저축액</span>
      <b id="analysisSaving">0원</b>
    </div>

  </div>

</section>


<!-- MODAL -->

<div id="modalBg" class="modal-bg hidden">

  <div class="modal">

    <button class="close" onclick="closeModal()">×</button>

    <h2 id="modalTitle"></h2>

    <div id="modalContent"></div>

  </div>

</div>


<!-- NAV -->

<nav class="nav">

  <button class="on" onclick="go('home',this)">
    <b>⌂</b>홈
  </button>

  <button onclick="go('ledger',this)">
    <b>₩</b>가계부
  </button>

  <button onclick="go('asset',this)">
    <b>▣</b>자산
  </button>

  <button onclick="go('debt',this)">
    <b>▤</b>부채
  </button>

  <button onclick="go('analysis',this)">
    <b>◔</b>분석
  </button>

</nav>

</div>


<script>

const KEY="my_asset_data_v1";

let data=JSON.parse(localStorage.getItem(KEY)||'null')||{
  assets:[],
  debts:[],
  transactions:[]
};

function save(){
  localStorage.setItem(KEY,JSON.stringify(data));
  render();
}

function won(n){
  return Number(n||0).toLocaleString("ko-KR")+"원";
}

function monthNow(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}

function go(id,btn){

  document.querySelectorAll(".wrap")
    .forEach(x=>x.classList.add("hidden"));

  document.getElementById(id)
    .classList.remove("hidden");

  document.querySelectorAll(".nav button")
    .forEach(x=>x.classList.remove("on"));

  if(btn) btn.classList.add("on");

  render();

  scrollTo(0,0);
}


function totals(){

  const asset=data.assets.reduce(
    (s,x)=>s+Number(x.amount||0),0
  );

  const debt=data.debts.reduce(
    (s,x)=>s+Number(x.amount||0),0
  );

  const cash=data.assets
    .filter(x=>x.type==="현금·예금")
    .reduce((s,x)=>s+Number(x.amount||0),0);

  const investment=data.assets
    .filter(x=>x.type==="투자")
    .reduce((s,x)=>s+Number(x.amount||0),0);

  const realEstate=data.assets
    .filter(x=>x.type==="부동산")
    .reduce((s,x)=>s+Number(x.amount||0),0);

  const etc=data.assets
    .filter(x=>x.type==="기타")
    .reduce((s,x)=>s+Number(x.amount||0),0);

  const month=monthNow();

  const income=data.transactions
    .filter(x=>x.month===month&&x.type==="income")
    .reduce((s,x)=>s+Number(x.amount||0),0);

  const expense=data.transactions
    .filter(x=>x.month===month&&x.type==="expense")
    .reduce((s,x)=>s+Number(x.amount||0),0);

  return {
    asset,
    debt,
    net:asset-debt,
    cash,
    investment,
    realEstate,
    etc,
    income,
    expense,
    saving:income-expense
  };
}


function render(){

  const t=totals();

  document.getElementById("netAsset").textContent=won(t.net);
  document.getElementById("totalAsset").textContent=won(t.asset);
  document.getElementById("totalDebt").textContent=won(t.debt);

  document.getElementById("cashAsset").textContent=won(t.cash);
  document.getElementById("investmentAsset").textContent=won(t.investment);
  document.getElementById("realEstateAsset").textContent=won(t.realEstate);
  document.getElementById("etcAsset").textContent=won(t.etc);

  document.getElementById("monthIncome").textContent=won(t.income);
  document.getElementById("monthExpense").textContent=won(t.expense);

  document.getElementById("ledgerIncome").textContent=won(t.income);
  document.getElementById("ledgerExpense").textContent=won(t.expense);

  document.getElementById("analysisNet").textContent=won(t.net);
  document.getElementById("analysisAsset").textContent=won(t.asset);
  document.getElementById("analysisDebt").textContent=won(t.debt);
  document.getElementById("analysisIncome").textContent=won(t.income);
  document.getElementById("analysisExpense").textContent=won(t.expense);
  document.getElementById("analysisSaving").textContent=won(t.saving);

  renderTransactions();
  renderAssets();
  renderDebts();
  renderRecent();
}


function renderRecent(){

  const box=document.getElementById("recentList");

  const arr=[...data.transactions]
    .sort((a,b)=>b.created-a.created)
    .slice(0,5);

  if(!arr.length){
    box.innerHTML='<div class="empty">아직 입력된 내역이 없습니다.</div>';
    return;
  }

  box.innerHTML=arr.map(x=>`

    <div class="item">

      <div class="row">

        <b>${x.memo||"내역"}</b>

        <b class="${x.type==="income"?"green":"red"}">
          ${x.type==="income"?"+":"-"}${won(x.amount)}
        </b>

      </div>

      <div class="muted">
        ${x.category||""} · ${x.month}
      </div>

    </div>

  `).join("");
}


function renderTransactions(){

  const box=document.getElementById("transactionList");

  if(!data.transactions.length){
    box.innerHTML='<div class="empty">등록된 가계부 내역이 없습니다.</div>';
    return;
  }

  const arr=[...data.transactions]
    .sort((a,b)=>b.created-a.created);

  box.innerHTML=arr.map((x,i)=>`

    <div class="item">

      <div class="row">

        <div>
          <b>${x.memo||"내역"}</b>
          <div class="muted">
            ${x.month} · ${x.category||"기타"}
          </div>
        </div>

        <div class="${x.type==="income"?"green":"red"}">
          ${x.type==="income"?"+":"-"}${won(x.amount)}
        </div>

      </div>

      <button
        class="btn gray"
        style="padding:8px;margin-top:8px"
        onclick="deleteTransaction(${i})">
        삭제
      </button>

    </div>

  `).join("");
}


function renderAssets(){

  const box=document.getElementById("assetList");

  if(!data.assets.length){
    box.innerHTML='<div class="empty">등록된 자산이 없습니다.</div>';
    return;
  }

  box.innerHTML=data.assets.map((x,i)=>`

    <div class="item">

      <div class="row">
        <div>
          <b>${x.name}</b>
          <div class="muted">${x.type}</div>
        </div>

        <b>${won(x.amount)}</b>
      </div>

      <button
        class="btn gray"
        style="padding:8px;margin-top:8px"
        onclick="deleteAsset(${i})">
        삭제
      </button>

    </div>

  `).join("");
}


function renderDebts(){

  const box=document.getElementById("debtList");

  if(!data.debts.length){
    box.innerHTML='<div class="empty">등록된 부채가 없습니다.</div>';
    return;
  }

  box.innerHTML=data.debts.map((x,i)=>`

    <div class="item">

      <div class="row">
        <div>
          <b>${x.name}</b>
          <div class="muted">${x.rate||0}% · ${x.type}</div>
        </div>

        <b class="red">${won(x.amount)}</b>
      </div>

      <button
        class="btn gray"
        style="padding:8px;margin-top:8px"
        onclick="deleteDebt(${i})">
        삭제
      </button>

    </div>

  `).join("");
}


function openTransaction(type){

  document.getElementById("modalTitle").textContent=
    type==="income"?"수입 입력":"지출 입력";

  document.getElementById("modalContent").innerHTML=`

    <label>금액</label>
    <input id="mAmount" type="number" placeholder="예: 3500000">

    <label>카테고리</label>
    <input id="mCategory" placeholder="급여, 식비, 교통비 등">

    <label>내용</label>
    <input id="mMemo" placeholder="예: 9월 급여">

    <button class="btn" onclick="saveTransaction('${type}')">
      저장
    </button>

  `;

  document.getElementById("modalBg").classList.remove("hidden");
}


function saveTransaction(type){

  const amount=Number(document.getElementById("mAmount").value);

  if(!amount){
    alert("금액을 입력해주세요.");
    return;
  }

  data.transactions.push({
    type,
    amount,
    category:document.getElementById("mCategory").value,
    memo:document.getElementById("mMemo").value,
    month:monthNow(),
    created:Date.now()
  });

  closeModal();
  save();
}


function openAsset(){

  document.getElementById("modalTitle").textContent="자산 추가";

  document.getElementById("modalContent").innerHTML=`

    <label>자산 종류</label>

    <select id="aType">
      <option>현금·예금</option>
      <option>투자</option>
      <option>부동산</option>
      <option>기타</option>
    </select>

    <label>자산 이름</label>
    <input id="aName" placeholder="예: 국민은행 예금">

    <label>금액</label>
    <input id="aAmount" type="number" placeholder="예: 50000000">

    <button class="btn" onclick="saveAsset()">
      저장
    </button>

  `;

  document.getElementById("modalBg").classList.remove("hidden");
}


function saveAsset(){

  const name=document.getElementById("aName").value;
  const amount=Number(document.getElementById("aAmount").value);

  if(!name||!amount){
    alert("자산 이름과 금액을 입력해주세요.");
    return;
  }

  data.assets.push({
    type:document.getElementById("aType").value,
    name,
    amount
  });

  closeModal();
  save();
}


function openDebt(){

  document.getElementById("modalTitle").textContent="부채 추가";

  document.getElementById("modalContent").innerHTML=`

    <label>부채 종류</label>

    <select id="dType">
      <option>주택담보대출</option>
      <option>신용대출</option>
      <option>자동차대출</option>
      <option>기타</option>
    </select>

    <label>대출 이름</label>
    <input id="dName" placeholder="예: 주택담보대출">

    <label>현재 잔액</label>
    <input id="dAmount" type="number" placeholder="예: 200000000">

    <label>금리 (%)</label>
    <input id="dRate" type="number" step="0.01" placeholder="예: 3.5">

    <button class="btn" onclick="saveDebt()">
      저장
    </button>

  `;

  document.getElementById("modalBg").classList.remove("hidden");
}


function saveDebt(){

  const name=document.getElementById("dName").value;
  const amount=Number(document.getElementById("dAmount").value);

  if(!name||!amount){
    alert("대출 이름과 잔액을 입력해주세요.");
    return;
  }

  data.debts.push({
    type:document.getElementById("dType").value,
    name,
    amount,
    rate:Number(document.getElementById("dRate").value)||0
  });

  closeModal();
  save();
}


function closeModal(){
  document.getElementById("modalBg").classList.add("hidden");
}


function deleteTransaction(i){
  if(confirm("이 내역을 삭제할까요?")){
    data.transactions.splice(i,1);
    save();
  }
}


function deleteAsset(i){
  if(confirm("이 자산을 삭제할까요?")){
    data.assets.splice(i,1);
    save();
  }
}


function deleteDebt(i){
  if(confirm("이 부채를 삭제할까요?")){
    data.debts.splice(i,1);
    save();
  }
}


render();

</script>

</body>
</html>
