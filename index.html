<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087cf0"><meta name="apple-mobile-web-app-capable" content="yes">
<title>부산 아파트 매매가격</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#172033}
.app{max-width:460px;min-height:100vh;margin:auto;background:#fff}.head{padding:18px 18px 14px;border-bottom:1px solid #edf0f3;position:sticky;top:0;background:#fff;z-index:5}.logo{font-weight:900;font-size:21px}.blue{color:#087cf0}.wrap{padding:16px 16px 92px}.search,select,input,textarea{width:100%;border:1px solid #dfe6ee;border-radius:13px;background:#fff;padding:13px;font-size:15px}.search{margin:12px 0}.btn{width:100%;border:0;border-radius:13px;padding:14px;background:#087cf0;color:#fff;font-weight:800;font-size:15px;margin-top:10px}.btn.gray{background:#edf3f8;color:#344}.chips{display:flex;gap:7px;overflow:auto;margin:10px 0}.chip{padding:8px 12px;border:1px solid #dce4ed;border-radius:20px;white-space:nowrap;font-size:12px}.chip.on{background:#087cf0;color:#fff}.section{font-weight:900;margin:18px 2px 9px}.card{border:1px solid #e5ebf1;border-radius:16px;padding:14px;margin:9px 0;box-shadow:0 2px 8px #12304008}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:#738096;font-size:12px;margin-top:5px}.price{font-weight:900;font-size:17px;margin-top:5px}.badge{font-size:10px;background:#eaf3ff;color:#087cf0;padding:4px 7px;border-radius:7px}.hidden{display:none}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);height:70px;background:#fff;border-top:1px solid #e5ebf1;display:flex;justify-content:space-around;align-items:center;z-index:10}.nav button{border:0;background:none;color:#7b8794;font-size:10px}.nav button b{display:block;font-size:20px;margin-bottom:2px}.nav button.on{color:#087cf0}.notice{background:#eef7ff;border:1px solid #d7ecff;border-radius:15px;padding:13px;font-size:12px}.error{background:#fff4f4;border-color:#ffd7d7;color:#b42318}
label{display:block;font-size:12px;font-weight:800;margin:12px 0 6px}.title{font-size:22px;font-weight:900}.back{font-size:24px;border:0;background:none}
</style></head><body><div class="app">
<header class="head"><div class="logo"><span class="blue">⌂</span> 부산 아파트 매매가격</div></header>

<section id="home" class="wrap">
<div class="notice">국토교통부 실거래 신고자료 기준 · 현재월 자료</div>
<div class="section">지역 선택</div><select id="gu"></select>
<div class="section">아파트 검색</div><input id="q" placeholder="예: 엘시티, 마린시티, 삼익비치">
<button class="btn" onclick="search()">실거래가 조회</button>
<div class="section">최근 거래 단지</div><div id="list"></div>
</section>

<section id="detail" class="wrap hidden">
<button class="back" onclick="go('home')">‹</button>
<div class="title" id="apt"></div><div class="muted" id="loc"></div>
<div class="section">최근 실거래가</div><div id="tradeList"></div>
<div class="section">내가 입력한 호가</div><div id="offerList"></div>
<button class="btn" onclick="go('offer')">+ 호가 직접 입력</button>
</section>

<section id="offer" class="wrap hidden">
<button class="back" onclick="go('detail')">‹</button><div class="title">호가 직접 입력</div>
<div class="card"><b id="offerApt"></b><div class="muted">입력한 정보는 이 앱의 데이터베이스에 저장됩니다.</div></div>
<label>전용면적(㎡)</label><input id="area" type="number" step="0.01" placeholder="84.98">
<label>호가(만원)</label><input id="price" type="number" placeholder="128000">
<label>층</label><input id="floor" placeholder="15">
<label>메모</label><textarea id="memo" rows="4" placeholder="남향 / 올수리 / 조망 등"></textarea>
<button class="btn" onclick="saveOffer()">저장하기</button>
</section>

<section id="update" class="wrap hidden">
<div class="title">데이터 업데이트</div>
<div class="notice">현재월의 실거래가 데이터를 국토교통부 API에서 다시 받아옵니다.</div>
<div class="section">선택 지역</div><select id="updateGu"></select>
<button class="btn" onclick="updateData()">지금 업데이트</button>
<div id="updateMsg" class="card muted"></div>
</section>

<nav class="nav">
<button class="on" onclick="go('home')"><b>⌂</b>홈</button>
<button onclick="go('home');$('q').focus()"><b>⌕</b>검색</button>
<button onclick="go('detail')"><b>♡</b>관심</button>
<button onclick="go('offer')"><b>▣</b>내 호가</button>
<button onclick="go('update')"><b>↻</b>업데이트</button>
</nav></div>
<script>
const $=id=>document.getElementById(id); let currentApt="";
function go(id){document.querySelectorAll(".wrap").forEach(x=>x.classList.add("hidden"));$(id).classList.remove("hidden");scrollTo(0,0)}
async function api(u,opt){const r=await fetch(u,opt);const j=await r.json();if(!r.ok)throw Error(j.error||"서버 오류");return j}
async function init(){try{const gs=await api("/api/gu");const opts=gs.map(x=>`<option value="${x.code}">${x.name}</option>`).join("");$("gu").innerHTML=opts;$("updateGu").innerHTML=opts;search()}catch(e){showError(e.message)}}
async function search(){try{const d=await api(`/api/complexes?gu_code=${$("gu").value}&q=${encodeURIComponent($("q").value)}`);$("list").innerHTML=d.slice(0,40).map(x=>`<div class="card" onclick="openApt(${JSON.stringify(x.apt_name)})"><div class="row"><b>${x.apt_name}</b><span class="badge">${x.trade_count}건</span></div></div>`).join("")||'<div class="card muted">현재월 거래가 없습니다. 다른 지역이나 검색어를 확인하세요.</div>'}catch(e){showError(e.message)}}
async function openApt(name){currentApt=name;go("detail");$("apt").textContent=name;$("loc").textContent=$("gu").selectedOptions[0].textContent;try{const d=await api(`/api/trades?gu_code=${$("gu").value}&apt_name=${encodeURIComponent(name)}`);$("tradeList").innerHTML=d.items.map(x=>`<div class="card"><div class="row"><span>${x.year}.${String(x.month).padStart(2,"0")}.${String(x.day).padStart(2,"0")}</span><b>${x.price_manwon.toLocaleString()}만원</b></div><div class="muted">${x.area}㎡ · ${x.floor}층 · ${x.dong}</div></div>`).join("")||'<div class="card muted">거래내역 없음</div>';const o=await api(`/api/offers?gu_code=${$("gu").value}&apt_name=${encodeURIComponent(name)}`);$("offerList").innerHTML=o.map(x=>`<div class="card"><div class="row"><b>${x.price_manwon.toLocaleString()}만원</b><span class="muted">${new Date(x.created_at).toLocaleString("ko-KR")}</span></div><div class="muted">${x.area||"-"}㎡ · ${x.floor||"-"}층</div><div>${x.memo||""}</div></div>`).join("")||'<div class="card muted">저장된 호가가 없습니다.</div>'}catch(e){showError(e.message)}}
async function saveOffer(){try{await api("/api/offers",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({gu_code:$("gu").value,apt_name:currentApt,area:Number($("area").value)||null,price_manwon:Number($("price").value),floor:$("floor").value,memo:$("memo").value})});await openApt(currentApt)}catch(e){showError(e.message)}}
async function updateData(){try{const g=$("updateGu").value;const d=await api("/api/update",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({gu_code:g})});$("updateMsg").textContent=`업데이트 완료 · ${d.deal_ym} · ${d.count}건 · ${new Date(d.updated_at).toLocaleString("ko-KR")}`}catch(e){showError(e.message)}}
function showError(msg){$("list").innerHTML=`<div class="card error"><b>데이터를 불러오지 못했습니다.</b><div style="margin-top:6px">${msg}</div></div>`}
init();
</script></body></html>
